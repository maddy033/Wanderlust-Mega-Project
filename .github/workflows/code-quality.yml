name: Code Quality

on:
  workflow_call:
    
jobs:
  CodeQuality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Lint Backend
        run: |
          cd backend
          npm ci || npm install
          npm run lint --if-present

      - name: Lint Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run lint --if-present