name: Code Quality

on:
   workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd backend && npm ci || npm install && npm run lint --if-present
      - run: cd frontend && npm ci || npm install && npm run lint --if-present '@ | Out-File -Encoding utf8 .github\workflows\code-quality.yml