version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:6-jammy
    container_name: wanderlust-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Redis Cache
  redis:
    image: redis:alpine
    container_name: wanderlust-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanderlust-backend
    restart: always
    ports:
      - "5000:8080" # Maps local port 5000 to container port 8080
    environment:
      - NODE_ENV=production
      - PORT=8080
      - CLIENT_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000
      - MONGO_URI=mongodb://admin:password@mongo:27017/wanderlust?authSource=admin
      - REDIS_URL=redis://redis:6379
    links:
      - mongo:mongo-service
    depends_on:
      - mongo
      - redis

  # 4. Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wanderlust-frontend
    restart: always
    ports:
      - "3000:5173" # Maps local port 3000 to frontend container
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo-data:
