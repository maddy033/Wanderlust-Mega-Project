apiVersion: apps/v1
kind: Deployment
metadata:
  name: wanderlust-backend
  labels:
    app: wanderlust-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wanderlust-backend
  template:
    metadata:
      labels:
        app: wanderlust-backend
    spec:
      containers:
        - name: backend
          image: mandar0333/wanderlust-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: MONGO_URI
---
apiVersion: v1
kind: Service
metadata:
  name: wanderlust-backend-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: wanderlust-backend